name: GTM demo
on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          if [ ! -d demo-exports ]; then unzip -q gtm-power-bi-demo.zip; fi
          cp -R generated expected-generated
          cp -R power-bi expected-power-bi
      - run: python -m unittest -v
      - run: python run_demo.py
      - run: |
          diff -r expected-generated generated
          diff -r expected-power-bi power-bi
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-gtm-demo
          path: |
            generated/
            power-bi/
